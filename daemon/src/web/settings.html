<!DOCTYPE html><html><head><title>Trust Sentinel</title><style>
body{font-family:Segoe UI,sans-serif;background:#1a1a2e;color:#e0e0e0;max-width:600px;margin:20px auto;padding:20px}
h1{color:#00ff88}.card{background:#16213e;padding:15px;border-radius:8px;margin:10px 0}
button{background:#00ff88;color:#000;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin:5px;font-weight:bold}
button.warn{background:#ff8c00;color:#fff}
</style></head><body>
<h1>Trust Sentinel</h1>
<div class="card"><strong>Status:</strong> <span id="state">Loading...</span><br>
<strong>Token:</strong> <span id="token">-</span></div>
<div class="card"><h3>Actions</h3>
<button onclick="api('reset')">Reset Baseline</button>
<button onclick="api('stealth')">Enable Stealth</button>
<button onclick="api('visible')">Disable Stealth</button>
<button onclick="api('home')">Set Home WiFi</button>
<button class="warn" onclick="api('repair')">Auto-Repair</button></div>
<script>
async function api(cmd){
    try{
        let r=await fetch('http://127.0.0.1:12789/token');
        let d=await r.json();
        let url='http://127.0.0.1:12789/'+cmd+'?token='+d.token;
        await fetch(url,{method:'POST'});
        refresh();
    }catch(e){alert('Failed: '+e)}
}
async function refresh(){
    try{
        let r=await fetch('http://127.0.0.1:12789');
        let d=await r.json();
        document.getElementById('state').textContent=d.trust_state;
        document.getElementById('token').textContent=(d.token||'').substring(0,12)+'...';
    }catch(e){document.getElementById('state').textContent='Offline'}
}
setInterval(refresh,3000);refresh();
</script></body></html>
