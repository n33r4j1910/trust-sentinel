<!DOCTYPE html><html><head><title>Trust Sentinel</title><style>
body{font-family:Segoe UI,sans-serif;background:#1a1a2e;color:#e0e0e0;max-width:600px;margin:20px auto;padding:20px}
h1{color:#00ff88}.card{background:#16213e;padding:15px;border-radius:8px;margin:10px 0}
.green{color:#00ff88}.yellow{color:#ffcc00}.red{color:#ff4444}.orange{color:#ff8c00}
button{background:#00ff88;color:#000;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin:5px;font-weight:bold}
button.danger{background:#ff4444;color:#fff}button.warn{background:#ff8c00;color:#fff}
</style></head><body>
<h1>Trust Sentinel</h1>
<div class="card"><strong>Status:</strong> <span id="state">Loading...</span><br>
<strong>Token:</strong> <span id="token">-</span><br>
<strong>Last Check:</strong> <span id="last">-</span></div>
<div class="card"><h3>Actions</h3>
<button onclick="api('reset')">Reset Baseline</button>
<button onclick="api('stealth')">Enable Stealth</button>
<button onclick="api('visible')">Disable Stealth</button>
<button onclick="api('home')">Set Home WiFi</button>
<button class="warn" onclick="api('repair')">Auto-Repair</button></div>
<div class="card"><h3>Recent Events</h3><div id="events">Loading...</div></div>
<script>
let _token='';
async function api(cmd){
    try{let r=await fetch('http://127.0.0.1:12789'),d=await r.json();_token=d.token;
    await fetch('http://127.0.0.1:12789/'+cmd+'?token='+_token,{method:'POST'});refresh();}catch(e){alert('Failed')}
}
async function refresh(){
    try{let r=await fetch('http://127.0.0.1:12789'),d=await r.json();
    document.getElementById('state').textContent=d.trust_state;
    document.getElementById('token').textContent=(d.token||'').substring(0,16)+'...';
    document.getElementById('last').textContent=new Date(d.last_check).toLocaleTimeString();
    document.getElementById('events').innerHTML=(d.latest_events||[]).map(e=>'<div class="event">'+e+'</div>').join('')||'No events';
    }catch(e){document.getElementById('state').textContent='Daemon offline'}
}
setInterval(refresh,3000);refresh();
</script></body></html>
